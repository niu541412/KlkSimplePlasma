name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build screen saver
        run: ./scripts/build.sh "${{ matrix.arch }}"
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/${{ matrix.arch }}/Klk's Simple Plasma.saver" \
            "Klk-Simple-Plasma-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Klk-Simple-Plasma-${{ matrix.arch }}
          path: Klk-Simple-Plasma-${{ matrix.arch }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.zip
